name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint with Ruff
        run: |
          # run ruff on the cli directory
          ruff check envytweaks-cli/

      - name: Syntax compile check
        run: |
          python -m py_compile envytweaks-cli/src/envytweaks/*.py

      - name: Run tests
        run: |
          cd envytweaks-cli
          pytest -q

      - name: Install package dry-run
        run: |
          cd envytweaks-cli
          pip install --dry-run .

  packaging-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Validate JSON metadata
        run: |
          jq empty envytweaks-gnome/metadata.json
          jq empty envytweaks-kde/metadata.json

      - name: Check GNOME JavaScript syntax
        run: |
          for file in envytweaks-gnome/*.js envytweaks-gnome/lib/*.js envytweaks-gnome/ui/*.js; do
            node --input-type=module --check < "$file"
          done

      - name: Check translations
        run: |
          msgfmt --check -o /dev/null po/es.po
          msgfmt --check -o /dev/null envytweaks-kde/contents/locale/es/es.po
